<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Botanical UI | Interactive Bloom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@1,600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --stem-color: #245230;
            --leaf-color: #316b40;
            --petal-deep: #4a0010;
            --petal-dark: #8a0327;
            --petal-mid: #d9184b;
            --petal-light: #ff4d79;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 30%, #1c141c 0%, #0a0a0f 80%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Ground the plant to the bottom */
            perspective: 1200px;
        }

        /* -----------------------
           CANVAS PHYSICS LAYER
           ----------------------- */
        #petal-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
        }

        /* -----------------------
           PLANT STRUCTURE (Responsive)
           ----------------------- */
        .plant-wrapper {
            position: relative;
            width: 100%;
            max-width: 450px;
            /* Reduced height to make the stem shorter overall */
            height: 70vh; 
            z-index: 100;
        }

        /* SVG Ground-Up Stem */
        .svg-plant {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
            z-index: 90;
        }

        .stem-path {
            fill: none;
            stroke: var(--stem-color);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            /* Quicker growth animation for a shorter stem */
            animation: growStem 2.2s cubic-bezier(0.35, 0.1, 0.25, 1) forwards;
            filter: drop-shadow(0 0 8px rgba(36, 82, 48, 0.5));
        }

        .leaf-path {
            fill: var(--leaf-color);
            stroke: #1b3d24;
            stroke-width: 1;
            opacity: 0;
            transform: scale(0) rotate(-20deg);
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));
        }

        /* Staggered Leaf Growth */
        .leaf-1 { animation: sproutLeaf 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.6s forwards; }
        .leaf-2 { animation: sproutLeaf 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.0s forwards; }
        .leaf-3 { animation: sproutLeaf 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.4s forwards; }
        .leaf-4 { animation: sproutLeaf 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 1.8s forwards; }

        /* -----------------------
           THE FLOWER (Slightly larger, sitting PERFECTLY on top)
           ----------------------- */
        .flower-head {
            position: absolute;
            /* Mathematically aligned to exactly where the new, shorter SVG stem ends (Y=300 in an 800 viewBox = 37.5%) */
            top: 37.5%; 
            left: 50%;
            /* Translate it UP by exactly half its height so the base of the flower touches the tip of the stem */
            transform: translate(-50%, -50%) scale(0);
            /* --- MODIFIED: Increased size --- */
            width: 320px; 
            height: 320px;
            /* ------------------------------- */
            z-index: 120;
            cursor: pointer;
            transform-style: preserve-3d;
            opacity: 0;
            /* Starts exactly as the stem finishes (2.2s) */
            animation: appearFlower 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.2s forwards, floatFlower 4s ease-in-out 3s infinite;
        }

        .flower-head:hover {
            filter: drop-shadow(0 0 20px rgba(255, 77, 121, 0.4));
        }

        /* Realistic Petal Textures */
        .css-petal {
            position: absolute;
            width: 65px;
            height: 90px;
            background: radial-gradient(circle at bottom, var(--petal-deep) 0%, var(--petal-dark) 40%, var(--petal-mid) 70%, var(--petal-light) 100%);
            border: 1px solid rgba(255, 107, 158, 0.3);
            border-radius: 50% 10% 50% 50%; 
            transform-origin: bottom right;
            bottom: 50%;
            right: 50%;
            opacity: 0;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.5), 2px 2px 8px rgba(0,0,0,0.4);
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1), opacity 1.5s ease;
        }

        .interaction-hint {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* -----------------------
           THE SOLID, ELEGANT CARD (Foreground)
           ----------------------- */
        .reveal-card {
            position: absolute;
            top: 50%;
            left: 50%;
            /* High z-index to ensure it sits above everything */
            z-index: 200; 
            /* Solid, warm cream color so it stands out completely */
            background: #faf5f0; 
            padding: 3.5rem 3rem;
            border-radius: 16px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            opacity: 0;
            /* Starts lower down to slide up beautifully */
            transform: translate(-50%, 40px); 
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            box-shadow: 0 40px 80px rgba(0,0,0,0.9), 0 0 0 8px rgba(250, 245, 240, 0.15);
        }

        .reveal-card.show {
            opacity: 1;
            /* Pops right to the center */
            transform: translate(-50%, -50%); 
            pointer-events: all;
        }

        .reveal-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--petal-dark); /* Elegant dark red text */
            margin-bottom: 1.2rem;
            letter-spacing: -0.5px;
        }

        .reveal-card p {
            color: #4a4a4a; /* Dark grey text for readability */
            line-height: 1.8;
            font-size: 1.05rem;
            font-weight: 400;
        }

        .signature {
            margin-top: 2rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--petal-mid);
        }

        /* Animations */
        @keyframes growStem { to { stroke-dashoffset: 0; } }
        @keyframes sproutLeaf { to { opacity: 1; transform: scale(1) rotate(0deg); } }
        @keyframes appearFlower { to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes floatFlower { 0%, 100% { margin-top: 0; } 50% { margin-top: -12px; } }
        @keyframes pulseText { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }

    </style>
</head>
<body>

    <canvas id="petal-canvas"></canvas>

    <div class="plant-wrapper">
        
        <svg class="svg-plant" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
            <path class="stem-path" d="M200,800 Q250,600 180,450 T200,300" />
            
            <path class="leaf-path leaf-1" style="transform-origin: 220px 680px;" d="M220,680 Q290,640 300,690 Q250,720 220,680" />
            <path class="leaf-path leaf-2" style="transform-origin: 185px 560px;" d="M185,560 Q100,530 90,580 Q140,600 185,560" />
            
            <path class="leaf-path leaf-3" style="transform-origin: 205px 440px;" d="M205,440 Q270,400 280,440 Q240,470 205,440" />
            <path class="leaf-path leaf-4" style="transform-origin: 190px 350px;" d="M190,350 Q130,320 120,360 Q160,380 190,350" />
        </svg>

        <div class="flower-head" id="flower" onclick="shatterFlower()">
            <div id="petals-wrapper"></div>
            <div class="interaction-hint" id="hint">Click to Interact</div>
        </div>

    </div>

    <div class="reveal-card" id="card">
        <h2>Beautifully Crafted</h2>
        <p>A true creation doesn't stay in the background. It grows from a strong foundation, blooms with complex layers, and stands front and center when the time is right.</p>
        <div class="signature">Secret Admirer ✨</div>
    </div>

    <script>
        /* ----------------------------------------------------
           1. REALISTIC ROSE ALGORITHM
           ---------------------------------------------------- */
        const petalWrapper = document.getElementById('petals-wrapper');
        const flower = document.getElementById('flower');
        const totalPetals = 60; 

        for (let i = 0; i < totalPetals; i++) {
            const petal = document.createElement('div');
            petal.className = 'css-petal';
            petal.style.transform = `rotate(0deg) scale(0) translateY(0)`;
            petal.style.zIndex = totalPetals - i; 
            petalWrapper.appendChild(petal);
        }

        // Wait for Shorter Stem to Grow (2.4 seconds)
        setTimeout(() => {
            const petals = document.querySelectorAll('.css-petal');
            
            petals.forEach((petal, index) => {
                setTimeout(() => {
                    const angle = index * 137.5; 
                    let scale = 0.15 + (index / totalPetals) * 0.8;
                    let pushOut = index * 1.2;
                    let tilt = index * 1.1;

                    // Inner tight bud
                    if (index < 15) {
                        pushOut = index * 0.4;
                        scale = 0.2 + (index * 0.02);
                    }
                    
                    petal.style.opacity = '1';
                    petal.style.transform = `rotateZ(${angle}deg) translateY(-${pushOut}px) rotateX(${tilt}deg) scale(${scale})`;
                }, index * 35); 
            });

            setTimeout(() => {
                const hint = document.getElementById('hint');
                hint.style.opacity = '1';
                hint.style.animation = 'pulseText 2s infinite';
            }, totalPetals * 35 + 500);

        }, 2400); 


        /* ----------------------------------------------------
           2. CANVAS PHYSICS ENGINE
           ---------------------------------------------------- */
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrame;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class PhysicsPetal {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 22 + 5; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 10; 

                this.gravity = 0.3;
                this.friction = 0.95; 
                this.swayPhase = Math.random() * Math.PI * 2;

                this.size = Math.random() * 15 + 10;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = (Math.random() - 0.5) * 10;
                
                const colors = ['#8a0327', '#d9184b', '#ff4d79'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = 1;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                
                this.x += this.vx + Math.sin(this.swayPhase) * 2;
                this.y += this.vy;
                this.swayPhase += 0.05;
                this.rotation += this.rotationSpeed;
                
                if (this.y > canvas.height - 100) {
                    this.opacity -= 0.02;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.bezierCurveTo(this.size, -this.size, this.size, this.size, 0, this.size);
                ctx.bezierCurveTo(-this.size, this.size, -this.size, -this.size, 0, -this.size);
                
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fill();
                ctx.restore();
            }
        }

        function renderPhysics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.opacity <= 0 || p.y > canvas.height + 50) {
                    particles.splice(i, 1);
                }
            }

            if (particles.length > 0) {
                animationFrame = requestAnimationFrame(renderPhysics);
            }
        }

        /* ----------------------------------------------------
           3. THE INTERACTION (SHATTER & CARD REVEAL)
           ---------------------------------------------------- */
        function shatterFlower() {
            flower.style.opacity = '0';
            flower.style.pointerEvents = 'none';

            const rect = flower.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;

            for (let i = 0; i < 200; i++) {
                particles.push(new PhysicsPetal(originX, originY));
            }

            renderPhysics();

            // The card pops up front and center!
            setTimeout(() => {
                document.getElementById('card').classList.add('show');
            }, 500);
        }
    </script>
</body>
</html>
